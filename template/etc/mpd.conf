music_directory	"/media"
playlist_directory	"/var/lib/mpd/playlists"
db_file			"/var/lib/mpd/database"
log_file		"/dev/null"	# логи в никуда: syslogd на плате нет
pid_file		"/run/mpd/pid"
state_file		"/run/mpd/state"	# tmpfs: очередь не персистим (решение юзера); системную громкость хранит PA
user			"mpd"
bind_to_address		"127.0.0.1"
port			"6600"

audio_output {
	type		"pulse"
	name		"Marusia PulseAudio"
	sink		"master"	# ролевой sink mpd — как в стоке, музыка = master
	mixer_type	"none"		# громкость mpd-потока не трогаем ВООБЩЕ: master = sink
				# PA (кнопки/LVA/DLNA-через-marusia-d), стрим создаётся
				# и наследует sink; при mixer hardware+scale_volume
				# flat-volumes устраивал гонку «кнопки vs mpd-поток»
}
