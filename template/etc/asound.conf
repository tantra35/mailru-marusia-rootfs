pcm.!default{
    type hw
    card 0
    device 3
}

ctl.!default{
    type hw
    card 0
}

pcm.loopback {
    type rate
    slave {
        pcm {
            type route
            slave.pcm loopback_48k
            slave.channels 2
            ttable.0.1 1
        }
        rate 48000
    }
    converter {
        name linear
        rate 16000
    }
}

pcm.delayed_mics {
    type delay
    channels 4
    frame_size 64
    slave.pcm mics
}

pcm.mics_loopback {
    type multi
    slaves.a.pcm "loopback"
    slaves.a.channels 1
    slaves.b.pcm "delayed_mics"
    slaves.b.channels 4

    bindings.0.slave b
    bindings.0.channel 0
    bindings.1.slave b
    bindings.1.channel 1
    bindings.2.slave b
    bindings.2.channel 2
    bindings.3.slave b
    bindings.3.channel 3
    bindings.4.slave a
    bindings.4.channel 0
}

pcm.mics_gain {
    type route
    slave.pcm delayed_mics
    slave.channels 4
    ttable.0.0 4
    ttable.1.1 4
    ttable.2.2 4
    ttable.3.3 4
}

pcm.mics_loopback_gain {
    type multi
    slaves.a.pcm loopback
    slaves.a.channels 1
    slaves.b.pcm mics_gain
    slaves.b.channels 4

    bindings.0.slave b
    bindings.0.channel 0
    bindings.1.slave b
    bindings.1.channel 1
    bindings.2.slave b
    bindings.2.channel 2
    bindings.3.slave b
    bindings.3.channel 3
    bindings.4.slave a
    bindings.4.channel 0
}

pcm.vqe {
    type vqe
    slave.pcm mics_loopback
    mic_channels 4
    spk_channels 1
    mic_geometry 2 # mini
    frame_size 256
    filter_length 768

    aec 0
    ns 0
    hpf 0
    bf 1
    doa 1
    phi_dt_st 0
    vad_dt_st 0

    agc 1
    agc_lvl 23100
    denoise 0
    denoise_lvl -55
    dereverb 0
    aec_sup -80
    aec_sup_ac -35
}

pcm.single_plugin {
    type single_plugin
    slave.pcm mics_loopback
    mic_channels 4
    spk_channels 1
    mic_geometry 2 # mini

    saec_frame_size 256
    saec_filter_length 768

    kf_F 1665
    kf_delta 0.110518
    kf_eps 0.001
    kf_lambda 0.993
    kf_frame_length 3328
    kf_n_fft 3328
    kf_frame_shift 832
    kf_window "hann"

    athena_frame_size 256
    athena_aec 0
    athena_agc 0
    athena_ns 0
    athena_hpf 0
    athena_bf 1
    athena_doa 1
    athena_phi_dt_st 1
    athena_vad_dt_st 0

    spp_frame_size 256
    spp_default_process_mode 0

    spp_asr_agc 1
    spp_asr_agc_lvl 23100
    spp_asr_denoise 0
    spp_asr_denoise_lvl 0
    spp_asr_dereverb 0
    spp_asr_aec_sup -75
    spp_asr_aec_sup_ac -55

    spp_com_agc 1
    spp_com_agc_lvl 90000
    spp_com_denoise 1
    spp_com_denoise_lvl -20
    spp_com_dereverb 0
    spp_com_aec_sup -30
    spp_com_aec_sup_ac -30
}

pcm.single_plugin_com {
    type single_plugin
    slave.pcm mics_loopback
    mic_channels 4
    spk_channels 1
    mic_geometry 2 # mini

    saec_frame_size 256
    saec_filter_length 768

    kf_F 1665
    kf_delta 0.110518
    kf_eps 0.001
    kf_lambda 0.993
    kf_frame_length 3328
    kf_n_fft 3328
    kf_frame_shift 832
    kf_window "hann"

    athena_frame_size 256
    athena_aec 0
    athena_agc 0
    athena_ns 0
    athena_hpf 0
    athena_bf 1
    athena_doa 1
    athena_phi_dt_st 1
    athena_vad_dt_st 0

    spp_frame_size 256
    spp_default_process_mode 1

    spp_asr_agc 1
    spp_asr_agc_lvl 23100
    spp_asr_denoise 0
    spp_asr_denoise_lvl 0
    spp_asr_dereverb 0
    spp_asr_aec_sup -75
    spp_asr_aec_sup_ac -55

    spp_com_agc 1
    spp_com_agc_lvl 90000
    spp_com_denoise 1
    spp_com_denoise_lvl -20
    spp_com_dereverb 0
    spp_com_aec_sup -30
    spp_com_aec_sup_ac -30
}

pcm.comm {
    type com
    slave.pcm mics_loopback_gain
    mic_channels 4
    spk_channels 1
    mic_geometry 2 # mini
    frame_size 256
    filter_length 768

    aec 0
    ns 0
    hpf 0
    bf 1
    doa 1
    phi_dt_st 0
    vad_dt_st 0

    agc 1
    agc_lvl 200000
    denoise 1
    denoise_lvl -10
    dereverb 0
    aec_sup -13
    aec_sup_ac -15

    res_denoise 1
    res_denoise_lvl -10
    res_dereverb 1
    res_aec_sup -10
    res_aec_sup_ac -40
}

pcm.playback {
    type dmix
    ipc_key 12345
    ipc_key_add_uid false
    ipc_perm 0666

    slave {
        pcm "hw:0,0"
        channels 2
        rate 48000
        format S16
        period_size 960 # 20ms, try to be in sync with pulseaudio
        periods 4
    }

    bindings {
        0 0
        1 1
    }
}

pcm.loopback_48k {
    ipc_key 1026
    type dsnoop
    slave {
        pcm "hw:0,2"
        channels 2
        rate 48000
        format S16
        period_size 1920 # 40ms
        periods 4
    }
}

pcm.mics {
    ipc_key 1027
    type dsnoop
    slave {
        pcm "hw:0,1"
        channels 4
        rate 16000
        format S16
        period_size 640
        periods 4
    }
}

pcm.stereo_playback {
    type            softvol
    slave.pcm       "playback"
    control.name    "StereoVolume"
    control.card    0
    min_dB          -60.0
    max_dB          0.0
    resolution      101
}

pcm.front_left {
   type route
   slave.pcm "stereo_playback"
   slave.channels 2
   ttable.0.0 1
   ttable.0.1 1
}

pcm.front_right {
   type route
   slave.pcm "stereo_playback"
   slave.channels 2
   ttable.1.0 1
   ttable.1.1 1
}
