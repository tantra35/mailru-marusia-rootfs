[global]
# Бэкенд pulseaudio: вывод в default sink (master), громкость sink'а — кнопки/HA.
# Авторизация: только zeroconf/OAuth — поля username/password в 0.4.2 удалены
# (игнорируются с warning). Первый вход: колонка появляется в приложении
# Spotify («Подключение» → Marusia), при первом запуске из него креды
# сохраняются в /var/cache/spotifyd/zeroconf. Нужен аккаунт Premium.
backend = "pulseaudio"
device_name = "Marusia"
device_type = "speaker"

# softvol масштабирует поток самого spotifyd — слайдер в приложении Spotify
# работает, sink (общая громкость) не трогает (кнопки/HA — поверх, мультипликативно).
volume_controller = "softvol"
bitrate = 160

# Кэш креды+аудио. no_audio_cache=true обязательно: флеш ubifs, аудио-кэш
# librespot по умолчанию ВКЛЮЧЁН (config.rs: audio_cache = !no_audio_cache.unwrap_or(false)).
cache_path = "/var/cache/spotifyd"
no_audio_cache = true

use_mpris = false # требует dbus session bus — на колонке его нет
