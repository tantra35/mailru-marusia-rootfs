# Пакетный daemon.conf закомментирован целиком, кроме вставленной Alpine-сборкой
# строки flat-volumes = no (APKBUILD:131); остальное — дефолты PA.
# flat-volumes = no ОБЯЗАТЕЛЕН: с ролевыми sink'ами (lva.pa) выталкивание громкости
