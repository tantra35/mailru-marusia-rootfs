# слайдер DLNA управляет ОБЩЕЙ громкостью, как кнопки/LVA (решение юзера 2026-11-07).
# PA: pa_sink_input_set_volume → pa_sink_set_volume(sink) (sink-input.c:1447-1452).
# Шкала mpd 0..100 при scale_volume 1.5 по-прежнему даёт sink 0..150.
# Остальные параметры — встроенные дефолты PA; пакетный daemon.conf был полностью
# закомментирован, кроме вставленной Alpine-сборкой строки flat-volumes = no (APKBUILD:131).
flat-volumes = yes
