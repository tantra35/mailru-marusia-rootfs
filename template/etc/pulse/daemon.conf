# Пакетный daemon.conf закомментирован целиком, кроме вставленной Alpine-сборкой
# строки flat-volumes = no (APKBUILD:131); остальное — дефолты PA.
# flat-volumes = no ОБЯЗАТЕЛЕН: с ролевыми sink'ами (lva.pa) выталкивание громкости
# sink-input'а в sink ломает независимость ролей и даёт гонки «кнопки vs поток».
flat-volumes = no
# single_plugin-тракт: playback строго 48к — от него зависит rate аппаратного
# loopback-FE (hw:0,2), с которым живёт вся DSP-цепь (48к→16к конверсия референса).
default-sample-rate = 48000
alternate-sample-rate = 44100
